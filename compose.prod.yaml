# Production topology (P0-012/P0-013, ADR-002/003/006). Caddy is the only service that publishes
# ports (80/443); everything else is reachable only on the private networks.
#
#   docker compose -f compose.prod.yaml --env-file /srv/nalara/.env run --rm migrate
#   docker compose -f compose.prod.yaml --env-file /srv/nalara/.env up -d
#
# Secrets come only from the host's env file at runtime (never baked into images).
# DB_APP_PASSWORD and DB_MIGRATOR_PASSWORD must be URL-safe (e.g. `openssl rand -hex 24`).
name: nalara

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  db:
    <<: *hardened
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    # The official entrypoint drops to the postgres user; it needs these to do so.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 512m

  # One-shot, explicit migration step (ADR-003): `docker compose run --rm migrate`.
  migrate:
    <<: *hardened
    image: nalara-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: 'no'
    profiles: [tools]
    command: ['node', 'dist/db/migrate-cli.js']
    environment:
      NODE_ENV: production
      DATABASE_MIGRATOR_URL: postgres://nalara_migrator:${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD}@db:5432/nalara
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *hardened
    image: nalara-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      DATABASE_URL: postgres://nalara_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD}@db:5432/nalara
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: '4000'
      # Only Caddy (fixed address below) may set the client IP via X-Forwarded-For.
      TRUSTED_PROXIES: 172.31.250.10
    networks: [backend, frontend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      db: { condition: service_healthy }
    stop_grace_period: 15s
    mem_limit: 384m

  web:
    <<: *hardened
    image: nalara-web:local
    build: { context: ., dockerfile: apps/web/Dockerfile }
    # Next.js may write its cache even when nothing is cacheable.
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
    networks: [frontend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      api: { condition: service_started }
    stop_grace_period: 15s
    mem_limit: 384m

  caddy:
    <<: *hardened
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    # Runs as root inside the container only to bind 80/443; every other capability is dropped.
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS to an ACME email, or internal for a rehearsal}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      frontend:
        ipv4_address: 172.31.250.10
    depends_on:
      api: { condition: service_started }
      web: { condition: service_started }
    mem_limit: 128m

networks:
  # Database traffic never leaves this network and it has no route outside the host.
  backend:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  db-data:
  caddy-data:
  caddy-config:
