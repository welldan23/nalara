# Production topology (P0-012/P0-013, ADR-002/003/006). Caddy is the only service that publishes
# ports (80/443); everything else is reachable only on the private networks.
#
#   docker compose -f compose.prod.yaml --env-file /srv/nalara/.env run --rm migrate
#   docker compose -f compose.prod.yaml --env-file /srv/nalara/.env up -d
#
# Secrets come only from the host's env file at runtime (never baked into images).
# DB_APP_PASSWORD, DB_MIGRATOR_PASSWORD and DB_WORKER_PASSWORD must be URL-safe
# (e.g. `openssl rand -hex 24`).
name: nalara

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  db:
    <<: *hardened
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    # The official entrypoint drops to the postgres user; it needs these to do so.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?set DB_WORKER_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 512m

  # One-shot, explicit migration step (ADR-003): `docker compose run --rm migrate`.
  migrate:
    <<: *hardened
    image: nalara-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: 'no'
    profiles: [tools]
    command: ['node', 'dist/db/migrate-cli.js']
    environment:
      NODE_ENV: production
      DATABASE_MIGRATOR_URL: postgres://nalara_migrator:${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD}@db:5432/nalara
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *hardened
    image: nalara-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      DATABASE_URL: postgres://nalara_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD}@db:5432/nalara
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: '4000'
      # Only Caddy and the web server (fixed addresses below) may set the client IP via
      # X-Forwarded-For. The web passes on the reader's address for its server-side calls, so
      # every reader gets their own rate-limit bucket (R-12).
      TRUSTED_PROXIES: 172.31.250.10,172.31.250.11
      # Launch switch (ADR-015): published articles stay off the public site until set to true.
      PUBLIC_SITE_ENABLED: ${PUBLIC_SITE_ENABLED:-false}
      # Founder Telegram bot webhook (P3-04, D-26): off while the secret is empty.
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_FOUNDER_USER_ID: ${TELEGRAM_FOUNDER_USER_ID:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    # `agent`: the agent runner reaches the tool gateway here, and nothing else (P3-05).
    networks: [backend, frontend, agent]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      db: { condition: service_healthy }
    stop_grace_period: 15s
    mem_limit: 384m

  # Phase 2 worker (P2-02): same image as the API, its own database role, no published port.
  # It reaches the database (backend) and the internet (egress) only: not the web, Caddy or the
  # API's public side. Every outbound request goes through the safe fetch (P2-01).
  worker:
    <<: *hardened
    image: nalara-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      WORKER_DATABASE_URL: postgres://nalara_worker:${DB_WORKER_PASSWORD:?set DB_WORKER_PASSWORD}@db:5432/nalara
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Founder Telegram bot, sending side (P3-04, D-26): off while the token is empty. The
      # webhook secret and site URL are only for `dist/cli/telegram-setup.js set-webhook`.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
    networks: [backend, egress]
    healthcheck:
      # The loop rewrites this file on every turn (at most every 5 s while idle).
      test: ['CMD-SHELL', 'test -n "$(find /tmp/nalara-worker.alive -mmin -1 2>/dev/null)"']
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    depends_on:
      db: { condition: service_healthy }
    stop_grace_period: 40s
    mem_limit: 256m

  # Phase 3 agent runner (P3-03/P3-05, ADR-020): same image, NO database credentials. It reaches
  # the API's tool gateway on the `agent` network and the AI provider on `egress`; it cannot reach
  # the database, the web server or Caddy. Opt-in: started only with `--profile agent`, after a
  # credential exists (`docker compose exec api node dist/cli/agent-credential.js create runner`).
  # Without AI_BASE_URL (D-25) it stays idle.
  agent:
    <<: *hardened
    image: nalara-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: [agent]
    command: ['node', 'dist/agent.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENT_GATEWAY_URL: http://api:4000
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_ROLES: ${AGENT_ROLES:-}
      AGENT_INTERVAL_SECONDS: ${AGENT_INTERVAL_SECONDS:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    networks: [agent, egress]
    healthcheck:
      # The runner rewrites this file at least every 30 s, also while idle.
      test: ['CMD-SHELL', 'test -n "$(find /tmp/nalara-agent.alive -mmin -1 2>/dev/null)"']
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 20s
    mem_limit: 192m

  web:
    <<: *hardened
    image: nalara-web:local
    build: { context: ., dockerfile: apps/web/Dockerfile }
    # Next.js may write its cache even when nothing is cacheable.
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      # Public origin for canonical URLs, sitemap and RSS (P1-08).
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
    networks:
      frontend:
        ipv4_address: 172.31.250.11
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      api: { condition: service_started }
    stop_grace_period: 15s
    mem_limit: 384m

  caddy:
    <<: *hardened
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    # Runs as root inside the container only to bind 80/443; every other capability is dropped.
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS to an ACME email, or internal for a rehearsal}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      frontend:
        ipv4_address: 172.31.250.10
    depends_on:
      api: { condition: service_started }
      web: { condition: service_started }
    mem_limit: 128m

networks:
  # Database traffic never leaves this network and it has no route outside the host.
  backend:
    internal: true
  # Outbound internet for the worker (P2-02) and the agent runner (P3-05). Nothing else joins it.
  egress:
  # The agent runner and the API only (P3-05): no database, no web, no Caddy, no route out.
  agent:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          # Dynamic addresses come from the upper half, so they never take a fixed one below.
          ip_range: 172.31.250.128/25

volumes:
  db-data:
  caddy-data:
  caddy-config:
